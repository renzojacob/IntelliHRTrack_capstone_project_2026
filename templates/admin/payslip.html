{% extends "admin/base_admin.html" %}
{% load static %}

{% block title %}Payslip: {{ payslip.employee_name }} | IntelliHRTrack{% endblock %}

{% block extra_head %}
{{ block.super }}
<style>
{% include "admin/_payslip_styles.html" %}
</style>
{% endblock %}

{% block content %}
<div class="ps ad-stack">

  <div class="ad-row ad-row--between no-print">
    <a href="{% url 'admin_payroll' %}?branch={{ branch.id }}&period={{ period.id }}&type={{ payslip.employment_type }}" class="ad-crumb" style="margin:0">
      <iconify-icon icon="ph:arrow-left" aria-hidden="true"></iconify-icon> Back to payroll
    </a>
    <button type="button" onclick="window.print()" class="ihrt-btn ihrt-btn--primary">
      <iconify-icon icon="ph:printer" aria-hidden="true"></iconify-icon> Print payslip
    </button>
  </div>

  {% include "admin/_payslip_document.html" %}
</div>
{% endblock %}
