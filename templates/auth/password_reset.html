{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password • IntelliHRTrack</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md rounded-2xl bg-white p-8 shadow-xl">
    <h1 class="text-2xl font-bold text-slate-900">
      Forgot Password
    </h1>

    <p class="mt-2 text-sm text-slate-600">
      Enter the email address connected to your IntelliHRTrack account.
      We will send you a secure password-reset link.
    </p>

    <form method="post" class="mt-6 space-y-5">
      {% csrf_token %}

      <div>
        <label
          for="id_email"
          class="mb-2 block text-sm font-medium text-slate-700"
        >
          Email address
        </label>

        <input
          id="id_email"
          name="email"
          type="email"
          autocomplete="email"
          required
          placeholder="name@gmail.com"
          class="w-full rounded-xl border border-slate-300 px-4 py-3 outline-none focus:border-teal-500 focus:ring-2 focus:ring-teal-200"
        >

        {% if form.email.errors %}
          <div class="mt-2 text-sm text-red-600">
            {{ form.email.errors }}
          </div>
        {% endif %}
      </div>

      <button
        type="submit"
        class="w-full rounded-xl bg-teal-600 px-4 py-3 font-semibold text-white transition hover:bg-teal-700"
      >
        Send password-reset link
      </button>
    </form>

    <a
      href="{% url 'login_ui' %}"
      class="mt-5 block text-center text-sm font-medium text-teal-700 hover:underline"
    >
      Return to login
    </a>
  </main>
</body>
</html>
