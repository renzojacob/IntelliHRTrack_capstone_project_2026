{% extends "auth/base_auth.html" %}
{% block title %}Password changed{% endblock %}

{% block card %}
  <div class="au-head">
    <span class="au-head__icon au-head__icon--ok"><iconify-icon icon="ph:check-circle" aria-hidden="true"></iconify-icon></span>
    <h1>Password changed</h1>
    <p>Your new password is saved. Sign in with it now.</p>
  </div>
  <a href="{% url 'login_ui' %}" class="ihrt-btn ihrt-btn--primary au-submit">Sign in</a>
{% endblock %}
