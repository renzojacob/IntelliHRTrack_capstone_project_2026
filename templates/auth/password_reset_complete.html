{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Changed • IntelliHRTrack</title>
  <link rel="stylesheet" href="{% static 'css/output.css' %}">
</head>

<body class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <main class="w-full max-w-md rounded-2xl bg-white p-8 text-center shadow-xl">
    <div class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-teal-100 text-2xl text-teal-700">
      ✓
    </div>

    <h1 class="mt-4 text-2xl font-bold text-slate-900">
      Password changed successfully
    </h1>

    <p class="mt-3 text-slate-600">
      You can now sign in to IntelliHRTrack using your new password.
    </p>

    <a
      href="{% url 'login_ui' %}"
      class="mt-6 inline-block rounded-xl bg-teal-600 px-5 py-3 font-semibold text-white hover:bg-teal-700"
    >
      Sign in
    </a>
  </main>
</body>
</html>
